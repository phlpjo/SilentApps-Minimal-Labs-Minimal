name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Passwort des Schlüssels – geheim ist der Schlüssel selbst (Secret KEYSTORE_B64)
      KEYSTORE_PASSWORD: "utG4WzYlVwsErW1-8F8tv0jm"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signierschlüssel
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret KEYSTORE_B64 fehlt – Testbuild ohne Signatur, kein Release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/minimal.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/minimal.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: APK bauen
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      # Bei Fehlern: Log in den Branch build-log (lässt sich ohne Actions-Zugriff lesen)
      - name: Build-Log sichern
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "kein Log" > /tmp/build.log
          git checkout --orphan build-log
          git rm -rfq . >/dev/null
          tail -c 200000 /tmp/build.log > build.log
          git add build.log
          git commit -qm "Build #${{ github.run_number }} fehlgeschlagen (${{ github.sha }})"
          git push -f origin build-log

      - name: Release veröffentlichen
        if: steps.key.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk Minimal.apk
          gh release create "v$V" Minimal.apk \
            --title "Minimal $V" \
            --notes "Auf dem Handy öffnen, Minimal.apk antippen und installieren. Neue Versionen installieren sich über die alte." \
            --latest

      - name: Testbuild als Artefakt
        if: steps.key.outputs.signed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Minimal-unsigniert
          path: app/build/outputs/apk/release/*.apk
