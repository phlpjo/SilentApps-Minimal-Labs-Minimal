name: Bauen (AAB + APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Passwort des Schlüssels – geheim ist der Schlüssel selbst (Secret KEYSTORE_B64)
      KEYSTORE_PASSWORD: "utG4WzYlVwsErW1-8F8tv0jm"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Signierschlüssel
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret KEYSTORE_B64 fehlt – Testbuild ohne Signatur."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/minimal.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/minimal.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: AAB und APK bauen
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace bundleRelease assembleRelease 2>&1 | tee build.log

      # Bei Fehlern: Log in den Branch build-log (lässt sich ohne Actions-Zugriff lesen)
      - name: Build-Log sichern
        if: failure()
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log 2>/dev/null || echo "kein Log" > /tmp/build.log
          git checkout --orphan build-log
          git rm -rfq . >/dev/null
          tail -c 200000 /tmp/build.log > build.log
          git add build.log
          git commit -qm "Build #${{ github.run_number }} fehlgeschlagen (${{ github.sha }})"
          git push -f origin build-log

      # Wächter: Bezahl-App bleibt offline – Build schlägt fehl, falls eine Bibliothek INTERNET einschleust
      - name: Berechtigungen prüfen
        run: |
          M=$(find app/build/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Manifest: $M"
          grep -o 'android.permission[.A-Z_]*' "$M" | sort -u
          if grep -q 'android.permission.INTERNET' "$M"; then echo "::error::INTERNET-Berechtigung gefunden"; exit 1; fi

      - name: Dateien benennen
        run: |
          V="1.0.${{ github.run_number }}"
          S=$([ "${{ steps.key.outputs.signed }}" = "true" ] && echo "" || echo "-unsigniert")
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab "out/Minimal-$V$S.aab"
          cp app/build/outputs/apk/release/*.apk "out/Minimal-$V$S.apk"
          ls -la out

      # Nur als privates Workflow-Artefakt – keine öffentlichen Releases (Bezahl-App)
      - uses: actions/upload-artifact@v4
        with:
          name: Minimal-1.0.${{ github.run_number }}
          path: out/*
          retention-days: 30
